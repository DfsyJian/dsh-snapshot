<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400"> 
   <defs> 
     <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"> 
       <stop offset="0" stop-color="#0f172a"/> 
       <stop offset="1" stop-color="#020617"/> 
     </linearGradient> 
     <linearGradient id="track" x1="0" y1="0" x2="1" y2="0"> 
       <stop offset="0" stop-color="#1e3a8a" stop-opacity="0.2"/> 
       <stop offset="1" stop-color="#06b6d4" stop-opacity="0.35"/> 
     </linearGradient> 
     <linearGradient id="rollback" x1="1" y1="0" x2="0" y2="0"> 
       <stop offset="0" stop-color="#ea580c" stop-opacity="0.1"/> 
       <stop offset="0.4" stop-color="#f97316" stop-opacity="0.8"/> 
       <stop offset="1" stop-color="#fdba74" stop-opacity="1"/> 
     </linearGradient> 
     <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"> 
       <feGaussianBlur stdDeviation="12" result="blur"/> 
       <feMerge> 
         <feMergeNode in="blur"/> 
         <feMergeNode in="SourceGraphic"/> 
       </feMerge> 
     </filter> 
     <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%"> 
       <feGaussianBlur stdDeviation="6" result="blur"/> 
       <feMerge> 
         <feMergeNode in="blur"/> 
         <feMergeNode in="SourceGraphic"/> 
       </feMerge> 
     </filter> 
     <marker id="arrow" viewBox="0 0 12 12" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse"> 
         <path d="M 0 1 L 10 6 L 0 11 L 3 6 Z" fill="#fdba74"/> 
       </marker> 
   </defs> 
  
   <rect width="1280" height="400" fill="url(#bg)"/> 
  
   <g opacity="0.18" stroke="#1e293b" stroke-width="1"> 
     <path d="M0 100 H1280 M0 200 H1280 M0 300 H1280"/> 
     <path d="M160 0 V400 M320 0 V400 M480 0 V400 M640 0 V400 M800 0 V400 M960 0 V400"/> 
   </g> 
  
   <g transform="translate(-12, -4) scale(1.15)">
     <text x="80" y="140" font-family="ui-sans-serif, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1"> 
       dsh-snapshot 
     </text> 
     <text x="80" y="190" font-family="ui-sans-serif, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8"> 
       自动快照 · 一键回滚
     </text> 
     <rect x="80" y="210" width="220" height="32" rx="8" fill="#0ea5e9" opacity="0.15"/> 
     <text x="92" y="232" font-family="ui-sans-serif, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#38bdf8"> 
       DeepSeek Harness 插件
     </text> 
   </g> 
  
   <g transform="translate(-200, -135) scale(1.25)"> 
      <!-- Track Base -->
     <rect x="520" y="300" width="560" height="24" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/> 
     <!-- Track Active Fill (up to v2) -->
     <rect x="520" y="300" width="200" height="24" rx="12" fill="url(#track)"/> 
  
     <g filter="url(#glow)"> 
       <!-- v1 (Normal) -->
       <circle cx="580" cy="312" r="14" fill="#0f172a" stroke="#0891b2" stroke-width="4"/> 
       
       <!-- v2 (Target, Highlighted) -->
       <circle cx="720" cy="312" r="18" fill="#0f172a" stroke="#22d3ee" stroke-width="5"/> 
       <circle cx="720" cy="312" r="6" fill="#22d3ee"/>
       
       <!-- v3 (Skipped, Dimmed) -->
       <circle cx="860" cy="312" r="14" fill="#0f172a" stroke="#334155" stroke-width="4"/> 
       
       <!-- latest (Source, Dimmed) -->
       <circle cx="1000" cy="312" r="14" fill="#0f172a" stroke="#475569" stroke-width="4"/> 
     </g> 
  
     <g font-family="ui-sans-serif, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#94a3b8"> 
       <text x="580" y="356" text-anchor="middle">v1</text> 
       <text x="720" y="358" text-anchor="middle" fill="#22d3ee" font-size="18">v2</text> 
       <text x="720" y="380" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="500">已恢复</text> 
       <text x="860" y="356" text-anchor="middle" fill="#475569">v3</text> 
       <text x="1000" y="356" text-anchor="middle" fill="#475569">latest</text> 
     </g> 
  
     <!-- Rollback Arrow -->
       <g filter="url(#glow-strong)"> 
         <path d="M 1000 285 Q 860 130 745 282" stroke="url(#rollback)" stroke-width="6" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/> 
       </g> 
  
     <!-- Rollback Text Label -->
      <g transform="translate(860, 180)">
        <rect x="-56" y="-14" width="112" height="28" rx="14" fill="#ea580c" opacity="0.2" stroke="#f97316" stroke-width="1"/>
        <text x="0" y="1" font-family="ui-sans-serif, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fdba74" text-anchor="middle" dominant-baseline="central" letter-spacing="1">
          /rollback
        </text>
      </g>
   </g> 
</svg>